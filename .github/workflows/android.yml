name: Verify Android

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install and test web app
        run: |
          npm ci
          npm test
          npm ls @capacitor/core @capacitor/android @capacitor/cli
          npm run android:sync
      - name: Prepare Java and Android SDK
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36"
      - name: Build Android debug and unsigned release APKs
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest
      - name: Verify packaged web assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("dist")
          files = [p for p in root.rglob("*") if p.is_file()]
          assert (root / "index.html").is_file()
          assert any(p.suffix == ".js" for p in files), "Missing JavaScript"
          assert any(p.suffix == ".wav" for p in files), "Missing narration"
          apk = "android/app/build/outputs/apk/debug/app-debug.apk"
          with ZipFile(apk) as archive:
              for file in files:
                  member = "assets/public/" + file.relative_to(root).as_posix()
                  assert archive.read(member) == file.read_bytes(), f"Asset mismatch: {member}"
          print(f"Verified {len(files)} web assets in {apk}")
          PY

      - name: Verify Google Services with synthetic configuration
        shell: bash
        run: |
          set -eu
          fixture_path="$PWD/android/app/google-services.json"
          trap 'rm -f "$fixture_path"' EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path

          # All values are deliberately synthetic and do not contact Firebase.
          config = {
              "project_info": {
                  "project_number": "123456789012",
                  "project_id": "synthetic-ci-project",
                  "storage_bucket": "synthetic-ci-project.invalid",
              },
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef",
                      "android_client_info": {
                          "package_name": "io.github.agammann.blossom",
                      },
                  },
                  "api_key": [{"current_key": "synthetic-test-key-not-a-secret"}],
              }],
              "configuration_version": "1",
          }
          Path("android/app/google-services.json").write_text(json.dumps(config))
          PY
          cd android
          ./gradlew --no-daemon :app:processDebugGoogleServices :app:assembleDebug
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          values = Path("app/build/generated/res/google-services/debug/values/values.xml")
          assert values.is_file(), f"Missing generated resources: {values}"
          strings = {el.attrib.get("name"): el.text for el in ET.parse(values).getroot()}
          assert strings.get("google_app_id") == "1:123456789012:android:0123456789abcdef"
          assert strings.get("gcm_defaultSenderId") == "123456789012"
          print("Verified synthetic Google Services resources")
          PY
